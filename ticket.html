<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Ticket</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  #ticketContainer svg {
    max-width: 100%;
    width: 350px;
    height: auto;
    border-radius: 5px;
  }
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    z-index: 1000;
    animation: confetti-fall 3s linear forwards;
  }
  @keyframes confetti-fall {
    to { transform: translateY(100vh) rotate(360deg); }
  }
</style>
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center vh-100">
  <div class="container text-center">
    <h1 class="mb-4">🎟️ Your Ticket</h1>
    <div id="ticketContainer" class="mb-4"></div>
    <p id="downloadMessage" class="text-muted d-none">Your ticket has been downloaded! 🎉</p>
    <button id="downloadBtn" class="btn btn-primary btn-lg d-none">Download Ticket</button>
    <button id="addToCalendarBtn" class="btn btn-success btn-lg d-none mt-3">Add to Calendar</button>
  </div>

  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const userName = getQueryParam('name') || 'Guest';

    function createConfetti() {
      const colors = ['#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#feca57','#ff9ff3','#54a0ff'];
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.background = colors[Math.floor(Math.random()*colors.length)];
        confetti.style.left = Math.random()*100+'vw';
        const size = Math.random()*8 + 4;
        confetti.style.width = confetti.style.height = size+'px';
        confetti.style.animationDuration = (Math.random()*2 + 2)+'s';
        confetti.style.animationDelay = Math.random()*0.5+'s';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
      }
    }

    fetch('Igando_Event_Ticket.svg')
      .then(res => res.text())
      .then(svgText => {
        const parser = new DOMParser();
        const svgDoc = parser.parseFromString(svgText,"image/svg+xml");
        const svg = svgDoc.querySelector('svg');
        const textEl = svg.querySelector('#username');
        if(textEl) textEl.textContent = userName;
        document.getElementById('ticketContainer').appendChild(svg);

        const serializer = new XMLSerializer();
        const updatedSVG = serializer.serializeToString(svg);
        const img = new Image();
        const svgBlob = new Blob([updatedSVG], {type:"image/svg+xml"});
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = svg.width.baseVal.value || 300;
          canvas.height = svg.height.baseVal.value || 150;
          canvas.getContext('2d').drawImage(img, 0,0);
          canvas.toBlob(blob => {
            const pngUrl = URL.createObjectURL(blob);
            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.classList.remove('d-none');
            downloadBtn.onclick = () => {
              const a = document.createElement('a');
              a.href = pngUrl;
              a.download = `${userName.replace(/[^a-z0-9]/gi,'_').toLowerCase()}_ticket.png`;
              a.click();
              downloadBtn.classList.add('d-none');
              document.getElementById('downloadMessage').classList.remove('d-none');
              createConfetti();
              setTimeout(()=>{URL.revokeObjectURL(pngUrl); URL.revokeObjectURL(url);},1000);
              const addToCalendarBtn = document.getElementById('addToCalendarBtn');
              addToCalendarBtn.classList.remove('d-none');
              addToCalendarBtn.addEventListener('click', addToCalendar);
            };
          }, 'image/png');
        };
        img.src = url;
      }).catch(err=>{
        console.error(err);
        document.getElementById('ticketContainer').innerHTML='<div class="alert alert-danger">Failed to load ticket.</div>';
      });

    function addToCalendar() {
      const start = new Date("2025-09-13T10:00:00");
      const end = new Date("2025-09-13T14:00:00");
      const formatDate = d => d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent("Igando Beauty Event")}&dates=${formatDate(start)}/${formatDate(end)}&details=${encodeURIComponent("Your event ticket 🎟️")}&location=${encodeURIComponent("Moreta Hall, Isheri Rd, Ijegun, Ikeja, Lagos")}`;
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
