<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Ticket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #ticketContainer svg {
            max-width: 100%;
            width: 350px;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 1000;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .loading-placeholder {
            width: 350px;
            height: 366px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 5px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .debug-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center vh-100 max-dvh-100">
    <div class="container text-center">
        <h1 class="mb-4">🎟️ Your Ticket</h1>

        <div id="loadingState" class="mb-4">
            <div class="loading-placeholder mx-auto"></div>
            <p class="text-muted mt-2">Generating your personalized ticket...</p>
        </div>

        <div id="debugInfo" class="debug-info d-none">
            <strong>Debug Information:</strong><br>
            <div id="debugMessages"></div>
        </div>

        <div id="ticketContainer" class="mb-4 d-none"></div>
        <div id="errorState" class="alert alert-danger d-none"></div>

        <p id="downloadMessage" class="text-muted d-none">Your ticket has been downloaded! 🎉</p>
        <button id="downloadBtn" class="btn btn-primary btn-lg d-none">Download Ticket</button>
        <button id="addToCalendarBtn" class="btn btn-success btn-lg d-none mt-3">Add to Calendar</button>
        <button id="toggleDebug" class="btn btn-secondary btn-sm mt-3">Show Debug Info</button>
    </div>

    <script>
        class TicketDisplay {
            constructor() {
                this.eventConfig = {
                    name: "Igando Beauty Event",
                    date: "2025-09-13T10:00:00",
                    endDate: "2025-09-13T14:00:00",
                    location: "Moreta Hall, Isheri Rd, Ijegun, Ikeja, Lagos",
                    svgFile: "Igando_Event_Ticket.svg"
                };

                this.elements = {
                    loadingState: document.getElementById('loadingState'),
                    ticketContainer: document.getElementById('ticketContainer'),
                    errorState: document.getElementById('errorState'),
                    downloadBtn: document.getElementById('downloadBtn'),
                    addToCalendarBtn: document.getElementById('addToCalendarBtn'),
                    downloadMessage: document.getElementById('downloadMessage'),
                    debugInfo: document.getElementById('debugInfo'),
                    debugMessages: document.getElementById('debugMessages'),
                    toggleDebug: document.getElementById('toggleDebug')
                };

                this.userName = this.getQueryParam('name') || 'Guest';
                this.debugMessages = [];

                this.setupDebugToggle();
                this.initialize();
            }

            setupDebugToggle() {
                this.elements.toggleDebug.onclick = () => {
                    if (this.elements.debugInfo.classList.contains('d-none')) {
                        this.elements.debugInfo.classList.remove('d-none');
                        this.elements.toggleDebug.textContent = 'Hide Debug Info';
                    } else {
                        this.elements.debugInfo.classList.add('d-none');
                        this.elements.toggleDebug.textContent = 'Show Debug Info';
                    }
                };
            }

            addDebugMessage(message) {
                this.debugMessages.push(`${new Date().toLocaleTimeString()}: ${message}`);
                this.elements.debugMessages.innerHTML = this.debugMessages.join('<br>');
                console.log('DEBUG:', message);
            }

            getQueryParam(param) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(param);
            }

            async initialize() {
                try {
                    this.addDebugMessage(`Starting initialization for user: ${this.userName}`);
                    this.addDebugMessage(`Current URL: ${window.location.href}`);
                    this.addDebugMessage(`SVG file path: ${this.eventConfig.svgFile}`);

                    await this.loadAndCustomizeTicket();
                    this.showTicket();
                } catch (error) {
                    this.addDebugMessage(`Error during initialization: ${error.message}`);
                    this.showError('Failed to load ticket. Please try again.');
                    console.error('Ticket loading error:', error);
                }
            }

            async loadAndCustomizeTicket() {
                try {
                    this.addDebugMessage(`Attempting to fetch SVG from: ${this.eventConfig.svgFile}`);

                    // Try different paths
                    const possiblePaths = [
                        this.eventConfig.svgFile,
                        `./${this.eventConfig.svgFile}`,
                        `/${this.eventConfig.svgFile}`,
                        `./assets/${this.eventConfig.svgFile}`,
                        `/assets/${this.eventConfig.svgFile}`
                    ];

                    let response = null;
                    let workingPath = null;

                    for (const path of possiblePaths) {
                        try {
                            this.addDebugMessage(`Trying path: ${path}`);
                            response = await fetch(path);

                            this.addDebugMessage(`Response status: ${response.status} (${response.statusText})`);
                            this.addDebugMessage(`Response URL: ${response.url}`);
                            this.addDebugMessage(`Content-Type: ${response.headers.get('content-type')}`);

                            if (response.ok) {
                                workingPath = path;
                                this.addDebugMessage(`✓ Successfully found SVG at: ${path}`);
                                break;
                            }
                        } catch (fetchError) {
                            this.addDebugMessage(`✗ Failed to fetch from ${path}: ${fetchError.message}`);
                        }
                    }

                    if (!response || !response.ok) {
                        throw new Error(`SVG file not found. Tried paths: ${possiblePaths.join(', ')}`);
                    }

                    const svgText = await response.text();
                    this.addDebugMessage(`SVG content length: ${svgText.length} characters`);
                    this.addDebugMessage(`SVG content preview: ${svgText.substring(0, 100)}...`);

                    const svg = this.customizeSVG(svgText);
                    this.elements.ticketContainer.appendChild(svg);

                    await this.setupDownload(svg);
                    this.addDebugMessage('✓ Ticket loaded and customized successfully');

                } catch (error) {
                    this.addDebugMessage(`Error in loadAndCustomizeTicket: ${error.message}`);
                    throw error;
                }
            }

            customizeSVG(svgText) {
                try {
                    this.addDebugMessage('Customizing SVG...');

                    const parser = new DOMParser();
                    const svgDoc = parser.parseFromString(svgText, "image/svg+xml");

                    // Check for parse errors
                    const parseError = svgDoc.querySelector('parsererror');
                    if (parseError) {
                        throw new Error(`SVG parsing error: ${parseError.textContent}`);
                    }

                    const svg = svgDoc.querySelector('svg');
                    if (!svg) {
                        throw new Error('No SVG element found in the document');
                    }

                    this.addDebugMessage(`SVG dimensions: ${svg.getAttribute('width')} x ${svg.getAttribute('height')}`);

                    const textElement = svg.querySelector('#username');
                    if (textElement) {
                        textElement.textContent = this.userName;
                        this.addDebugMessage(`✓ Updated username to: ${this.userName}`);
                    } else {
                        this.addDebugMessage('⚠ No #username element found in SVG');

                        // List all elements with IDs for debugging
                        const elementsWithIds = svg.querySelectorAll('[id]');
                        this.addDebugMessage(`Available IDs: ${Array.from(elementsWithIds).map(el => el.id).join(', ')}`);
                    }

                    return svg;
                } catch (error) {
                    this.addDebugMessage(`Error in customizeSVG: ${error.message}`);
                    throw error;
                }
            }

            async setupDownload(svg) {
                return new Promise((resolve, reject) => {
                    try {
                        this.addDebugMessage('Setting up download...');

                        const serializer = new XMLSerializer();
                        const updatedSVG = serializer.serializeToString(svg);
                        const svgBlob = new Blob([updatedSVG], { type: "image/svg+xml" });
                        const url = URL.createObjectURL(svgBlob);

                        this.addDebugMessage(`SVG blob created, size: ${svgBlob.size} bytes`);

                        const img = new Image();
                        img.onload = () => {
                            try {
                                this.addDebugMessage(`Image loaded: ${img.width} x ${img.height}`);

                                const canvas = this.createCanvas(svg, img);
                                canvas.toBlob(blob => {
                                    if (!blob) {
                                        reject(new Error('Failed to create PNG blob'));
                                        return;
                                    }

                                    this.addDebugMessage(`PNG blob created, size: ${blob.size} bytes`);
                                    const pngUrl = URL.createObjectURL(blob);
                                    this.setupDownloadButton(pngUrl);
                                    this.cleanupUrls(url);
                                    resolve();
                                }, 'image/png');
                            } catch (canvasError) {
                                this.addDebugMessage(`Canvas error: ${canvasError.message}`);
                                reject(canvasError);
                            }
                        };

                        img.onerror = (imgError) => {
                            this.addDebugMessage(`Image loading error: ${imgError}`);
                            reject(new Error('Failed to load SVG as image'));
                        };

                        img.src = url;
                    } catch (setupError) {
                        this.addDebugMessage(`Setup error: ${setupError.message}`);
                        reject(setupError);
                    }
                });
            }

            createCanvas(svg, img) {
                const canvas = document.createElement('canvas');
                const width = svg.width?.baseVal?.value || img.width || 350;
                const height = svg.height?.baseVal?.value || img.height || 200;

                canvas.width = width;
                canvas.height = height;

                this.addDebugMessage(`Canvas created: ${width} x ${height}`);

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                return canvas;
            }

            setupDownloadButton(pngUrl) {
                this.elements.downloadBtn.classList.remove('d-none');
                this.elements.downloadBtn.onclick = () => this.downloadTicket(pngUrl);
                this.addDebugMessage('✓ Download button ready');
            }

            downloadTicket(pngUrl) {
                try {
                    const link = document.createElement('a');
                    link.href = pngUrl;
                    link.download = this.generateFileName();
                    link.click();

                    this.addDebugMessage(`✓ Download initiated: ${link.download}`);
                    this.showDownloadSuccess();
                    this.showCalendarButton();
                } catch (downloadError) {
                    this.addDebugMessage(`Download error: ${downloadError.message}`);
                }
            }

            generateFileName() {
                const safeName = this.userName
                    .replace(/[^a-z0-9]/gi, '_')
                    .toLowerCase();
                return `${safeName}_ticket.png`;
            }

            showDownloadSuccess() {
                this.elements.downloadBtn.classList.add('d-none');
                this.elements.downloadMessage.classList.remove('d-none');
                this.createConfetti();
            }

            showCalendarButton() {
                this.elements.addToCalendarBtn.classList.remove('d-none');
                this.elements.addToCalendarBtn.onclick = () => this.addToCalendar();
            }

            createConfetti() {
                const colors = [
                    '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4',
                    '#feca57', '#ff9ff3', '#54a0ff'
                ];

                const fragment = document.createDocumentFragment();

                for (let i = 0; i < 50; i++) {
                    const confetti = this.createConfettiPiece(colors);
                    fragment.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 4000);
                }

                document.body.appendChild(fragment);
            }

            createConfettiPiece(colors) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';

                const size = Math.random() * 8 + 4;
                confetti.style.width = confetti.style.height = size + 'px';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';

                return confetti;
            }

            addToCalendar() {
                const { name, date, endDate, location } = this.eventConfig;

                const startDate = new Date(date);
                const endEventDate = new Date(endDate);

                const formatDate = d => d.toISOString()
                    .replace(/[-:]/g, "")
                    .split(".")[0] + "Z";

                const calendarUrl = this.buildCalendarUrl({
                    title: name,
                    start: formatDate(startDate),
                    end: formatDate(endEventDate),
                    description: "Your event ticket 🎟️",
                    location: location
                });

                window.open(calendarUrl, "_blank");
                this.addDebugMessage('✓ Calendar event opened');
            }

            buildCalendarUrl({ title, start, end, description, location }) {
                const baseUrl = "https://calendar.google.com/calendar/render";
                const params = new URLSearchParams({
                    action: "TEMPLATE",
                    text: title,
                    dates: `${start}/${end}`,
                    details: description,
                    location: location
                });

                return `${baseUrl}?${params.toString()}`;
            }

            showTicket() {
                this.elements.loadingState.style.display = 'none';
                this.elements.ticketContainer.classList.remove('d-none');
                this.addDebugMessage('✓ Ticket displayed');
            }

            showError(message) {
                this.elements.loadingState.classList.add('d-none');
                this.elements.errorState.textContent = message;
                this.elements.errorState.classList.remove('d-none');

                // Show debug info when there's an error
                this.elements.debugInfo.classList.remove('d-none');
                this.elements.toggleDebug.textContent = 'Hide Debug Info';

                // Scroll error into view on mobile
                this.elements.errorState.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });

                // Add haptic feedback
                if ('vibrate' in navigator) {
                    navigator.vibrate([100, 50, 100]);
                }
            }

            cleanupUrls(...urls) {
                setTimeout(() => {
                    urls.forEach(url => {
                        try {
                            URL.revokeObjectURL(url);
                            this.addDebugMessage(`✓ Cleaned up URL: ${url.substring(0, 50)}...`);
                        } catch (e) {
                            this.addDebugMessage(`⚠ Failed to cleanup URL: ${e.message}`);
                        }
                    });
                }, 1000);
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new TicketDisplay();
        });
    </script>
</body>
</html>
