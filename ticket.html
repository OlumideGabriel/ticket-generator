<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Ticket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #ticketContainer svg {
            max-width: 100%;
            width: 350px;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 1000;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .loading-placeholder {
            width: 350px;
            height: 366px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 5px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center vh-100 max-dvh-100">
    <div class="container text-center">
        <h1 class="mb-4">🎟️ Your Ticket</h1>

        <div id="loadingState" class="mb-4">
            <div class="loading-placeholder mx-auto"></div>
            <p class="text-muted mt-2">Generating your personalized ticket...</p>
        </div>

        <div id="ticketContainer" class="mb-4 d-none"></div>
        <div id="errorState" class="alert alert-danger d-none"></div>

        <p id="downloadMessage" class="text-muted d-none">Your ticket has been downloaded! 🎉</p>
        <button id="downloadBtn" class="btn btn-primary btn-lg d-none">Download Ticket</button>
        <button id="addToCalendarBtn" class="btn btn-success btn-lg d-none mt-3">Add to Calendar</button>
    </div>

    <script>
        class TicketDisplay {
            constructor() {
                this.eventConfig = {
                    name: "Valentine Beauty Event",
                    date: "2026-02-14T10:00:00",
                    endDate: "2026-02-14T14:00:00",
                    location: "The Shield Convention Centre, Osi Roundabout, Navy Road, Ota, Ogun state",
                    svgFile: "Valentine_Beauty_Event_Ticket.svg"
                };

                this.elements = {
                    loadingState: document.getElementById('loadingState'),
                    ticketContainer: document.getElementById('ticketContainer'),
                    errorState: document.getElementById('errorState'),
                    downloadBtn: document.getElementById('downloadBtn'),
                    addToCalendarBtn: document.getElementById('addToCalendarBtn'),
                    downloadMessage: document.getElementById('downloadMessage')
                };

                this.userName = this.getQueryParam('name') || 'Guest';
                this.initialize();
            }

            getQueryParam(param) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(param);
            }

            async initialize() {
                try {
                    await this.loadAndCustomizeTicket();
                    this.showTicket();
                } catch (error) {
                    this.showError('Failed to load ticket. Please try again.');
                }
            }

            async loadAndCustomizeTicket() {
                const possiblePaths = [
                    this.eventConfig.svgFile,
                    `./${this.eventConfig.svgFile}`,
                    `/${this.eventConfig.svgFile}`,
                    `./assets/${this.eventConfig.svgFile}`,
                    `/assets/${this.eventConfig.svgFile}`
                ];

                let response = null;
                for (const path of possiblePaths) {
                    try {
                        response = await fetch(path);
                        if (response.ok) break;
                    } catch {}
                }

                if (!response || !response.ok) {
                    throw new Error("SVG file not found");
                }

                const svgText = await response.text();
                const svg = this.customizeSVG(svgText);
                this.elements.ticketContainer.appendChild(svg);
                await this.setupDownload(svg);
            }

            customizeSVG(svgText) {
                const parser = new DOMParser();
                const svgDoc = parser.parseFromString(svgText, "image/svg+xml");
                const svg = svgDoc.querySelector('svg');
                if (!svg) throw new Error('No SVG element found');

                const textElement = svg.querySelector('#username');
                if (textElement) textElement.textContent = this.userName;

                return svg;
            }

            async setupDownload(svg) {
                return new Promise((resolve, reject) => {
                    try {
                        const serializer = new XMLSerializer();
                        const updatedSVG = serializer.serializeToString(svg);
                        const svgBlob = new Blob([updatedSVG], { type: "image/svg+xml" });
                        const url = URL.createObjectURL(svgBlob);

                        const img = new Image();
                        img.onload = () => {
                            try {
                                const canvas = this.createCanvas(svg, img);
                                canvas.toBlob(blob => {
                                    if (!blob) {
                                        reject(new Error('Failed to create PNG blob'));
                                        return;
                                    }
                                    const pngUrl = URL.createObjectURL(blob);
                                    this.setupDownloadButton(pngUrl);
                                    URL.revokeObjectURL(url);
                                    resolve();
                                }, 'image/png');
                            } catch (canvasError) {
                                reject(canvasError);
                            }
                        };

                        img.onerror = () => reject(new Error('Failed to load SVG as image'));
                        img.src = url;
                    } catch (setupError) {
                        reject(setupError);
                    }
                });
            }

            createCanvas(svg, img) {
                const canvas = document.createElement('canvas');
                const width = svg.width?.baseVal?.value || img.width || 350;
                const height = svg.height?.baseVal?.value || img.height || 200;
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                return canvas;
            }

            setupDownloadButton(pngUrl) {
                this.elements.downloadBtn.classList.remove('d-none');
                this.elements.downloadBtn.onclick = () => this.downloadTicket(pngUrl);
            }

            async downloadTicket(pngUrl) {
                try {
                    // Fetch the PNG blob
                    const response = await fetch(pngUrl);
                    const blob = await response.blob();

                    // Chrome/Edge with File System Access API
                    if (window.showSaveFilePicker) {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: this.generateFileName(),
                            types: [{
                                description: 'PNG Image',
                                accept: { 'image/png': ['.png'] }
                            }]
                        });
                        const writable = await handle.createWritable();
                        await writable.write(blob);
                        await writable.close();
                        alert("Ticket saved successfully!");
                    } else {
                        // Fallback: normal download
                        const link = document.createElement('a');
                        link.href = pngUrl;
                        link.download = this.generateFileName();
                        link.click();

                        // 📱 On mobile → also open in new tab for "Save to Photos"
                        if (/Mobi|Android/i.test(navigator.userAgent)) {
                            window.open(pngUrl, "_blank");
                        }
                    }

                    this.showDownloadSuccess();
                    this.showCalendarButton();
                } catch (err) {
                    console.error("Download failed:", err);
                    alert("Could not save ticket. Please try again.");
                }
            }


            generateFileName() {
                const safeName = this.userName
                    .replace(/[^a-z0-9]/gi, '_')
                    .toLowerCase();
                return `${safeName}_ticket.png`;
            }

            showDownloadSuccess() {
                this.elements.downloadBtn.classList.add('d-none');
                this.elements.downloadMessage.classList.remove('d-none');
                this.createConfetti();
            }

            showCalendarButton() {
                this.elements.addToCalendarBtn.classList.remove('d-none');
                this.elements.addToCalendarBtn.onclick = () => this.addToCalendar();
            }

            createConfetti() {
                const colors = [
                    '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4',
                    '#feca57', '#ff9ff3', '#54a0ff'
                ];

                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 50; i++) {
                    const confetti = this.createConfettiPiece(colors);
                    fragment.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }
                document.body.appendChild(fragment);
            }

            createConfettiPiece(colors) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';

                const size = Math.random() * 8 + 4;
                confetti.style.width = confetti.style.height = size + 'px';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';

                return confetti;
            }

            addToCalendar() {
                const { name, date, endDate, location } = this.eventConfig;
                const startDate = new Date(date);
                const endEventDate = new Date(endDate);
                const formatDate = d => d.toISOString()
                    .replace(/[-:]/g, "")
                    .split(".")[0] + "Z";

                const baseUrl = "https://calendar.google.com/calendar/render";
                const params = new URLSearchParams({
                    action: "TEMPLATE",
                    text: name,
                    dates: `${formatDate(startDate)}/${formatDate(endEventDate)}`,
                    details: "Your event ticket 🎟️",
                    location: location
                });

                window.open(`${baseUrl}?${params.toString()}`, "_blank");
            }

            showTicket() {
                this.elements.loadingState.style.display = 'none';
                this.elements.ticketContainer.classList.remove('d-none');
            }

            showError(message) {
                this.elements.loadingState.classList.add('d-none');
                this.elements.errorState.textContent = message;
                this.elements.errorState.classList.remove('d-none');

                if ('vibrate' in navigator) {
                    navigator.vibrate([100, 50, 100]);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new TicketDisplay();
        });
    </script>
</body>
</html>
