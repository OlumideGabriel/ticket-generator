<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ticket Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center min-vh-100">
  <div class="container text-center">
    <h1 class="mb-4">🎟️ Get Your Custom Ticket</h1>
    <form id="ticketForm" class="mx-auto w-100" style="max-width: 400px;">
      <div class="mb-3">
        <label for="name" class="form-label">Enter your name:</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Your Name" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Generate Ticket</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('ticketForm');
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      if (!name) return alert("Please enter your name.");

      const webAppURL = "https://script.google.com/macros/s/AKfycbx8wEL1_N5PP_Zu9AEWDtThUxdIAHF2V4EW8_C8PpoT9HsqoNFT_AJDtBr6yMVlX7it/exec";
      const submitBtn = form.querySelector('button[type="submit"]');
      
      try {
        // Disable button to prevent multiple submissions
        submitBtn.disabled = true;
        submitBtn.textContent = 'Generating...';
        
        // Send name to Google Sheets
        const response = await fetch(webAppURL, {
          method: "POST",
          mode: "no-cors",
          headers: { 
            "Content-Type": "application/json" 
          },
          body: JSON.stringify({ name })
        });
        
        console.log('Response status:', response.status);
        
        // Even with no-cors, we can't read the response, but we can log that we sent the request
        console.log('Request sent to Google Sheets');
        
      } catch (error) {
        console.error('Error:', error);
        // Continue to redirect even if there's an error
      } finally {
        // Always redirect to ticket page
        window.location.href = `ticket.html?name=${encodeURIComponent(name)}`;
      }
    });
  </script>
</body>
</html>
