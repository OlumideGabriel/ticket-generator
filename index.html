<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticket Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="container text-center">
        <h1 class="mb-4">🎟️ Get Your Custom Ticket</h1>

        <form id="ticketForm" class="mx-auto w-100" style="max-width: 400px;">
            <div class="mb-3">
                <label for="name" class="form-label">Enter your name:</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Your Name" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                Generate Ticket
            </button>
        </form>

        <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
    </div>

    <script>
        class TicketGenerator {
            constructor() {
                this.webAppURL = "https://script.google.com/macros/s/AKfycbx8wEL1_N5PP_Zu9AEWDtThUxdIAHF2V4EW8_C8PpoT9HsqoNFT_AJDtBr6yMVlX7it/exec";
                this.form = document.getElementById('ticketForm');
                this.nameInput = document.getElementById('name');
                this.submitBtn = document.getElementById('submitBtn');
                this.errorMessage = document.getElementById('errorMessage');

                this.initializeEventHandlers();
            }

            initializeEventHandlers() {
                this.form.addEventListener('submit', (e) => this.handleFormSubmit(e));
            }

            async handleFormSubmit(e) {
                e.preventDefault();

                const name = this.validateInput();
                if (!name) return;

                await this.processTicketGeneration(name);
            }

            validateInput() {
                const name = this.nameInput.value.trim();

                if (!name) {
                    this.showError("Please enter your name.");
                    return null;
                }

                if (name.length > 50) {
                    this.showError("Name is too long. Please use a shorter name.");
                    return null;
                }

                this.hideError();
                return name;
            }

            async processTicketGeneration(name) {
                this.setLoadingState(true);

                try {
                    await this.saveToGoogleSheets(name);
                    this.redirectToTicketPage(name);
                } catch (error) {
                    console.error('Error processing ticket:', error);
                    // Still redirect to ticket page as the main functionality should work
                    this.redirectToTicketPage(name);
                } finally {
                    this.setLoadingState(false);
                }
            }

            async saveToGoogleSheets(name) {
                try {
                    const response = await fetch(this.webAppURL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ name })
                    });

                    console.log('Data sent to Google Sheets for:', name);
                } catch (error) {
                    console.error('Google Sheets error:', error);
                    // Don't throw - we still want to generate the ticket
                }
            }

            redirectToTicketPage(name) {
                const encodedName = encodeURIComponent(name);
                window.location.href = `ticket.html?name=${encodedName}`;
            }

            setLoadingState(isLoading) {
                if (isLoading) {
                    this.submitBtn.disabled = true;
                    this.submitBtn.innerHTML = '<span class="loading-spinner me-2"></span>Generating...';
                } else {
                    this.submitBtn.disabled = false;
                    this.submitBtn.textContent = 'Generate Ticket';
                }
            }

            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.classList.remove('d-none');

                // Add haptic feedback on mobile devices
                if ('vibrate' in navigator) {
                    navigator.vibrate([100]);
                }
            }

            hideError() {
                this.errorMessage.classList.add('d-none');
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new TicketGenerator();
        });
    </script>
</body>
</html>
